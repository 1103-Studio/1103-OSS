services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: 1103-oss-postgres
    environment:
      POSTGRES_DB: oss
      POSTGRES_USER: oss
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oss_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "15432:5432"
    networks:
      - 1103-oss-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oss -d oss"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: 1103-oss-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "16379:6379"
    networks:
      - 1103-oss-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 1103-OSS API 服务 (生产模式)
  gooss-api:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    container_name: gooss-api
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=oss
      - DB_PASSWORD=${DB_PASSWORD:-oss_password}
      - DB_NAME=oss
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_PATH=/data/oss
      - ROOT_USER=${ROOT_USER:-admin}
      - ROOT_PASSWORD=${ROOT_PASSWORD:-admin123}
      - INIT_ACCESS_KEY=${INIT_ACCESS_KEY:-}
      - INIT_ACCESS_SECRET=${INIT_ACCESS_SECRET:-}
      - LOG_LEVEL=info
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - API_ENDPOINT=${API_ENDPOINT:-}
    volumes:
      - oss-data:/data/oss
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - 1103-oss-network
    restart: unless-stopped
    profiles:
      - prod
      - production

  # 1103-OSS API 服务 (开发模式 - 支持热重载)
  gooss-api-dev:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.dev
    container_name: 1103-oss-api-dev
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=oss
      - DB_PASSWORD=${DB_PASSWORD:-oss_password}
      - DB_NAME=oss
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_PATH=/data/oss
      - ROOT_USER=${ROOT_USER:-admin}
      - ROOT_PASSWORD=${ROOT_PASSWORD:-admin123}
      - INIT_ACCESS_KEY=${INIT_ACCESS_KEY:-}
      - INIT_ACCESS_SECRET=${INIT_ACCESS_SECRET:-}
      - LOG_LEVEL=debug
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - API_ENDPOINT=${API_ENDPOINT:-}
    volumes:
      - ..:/app
      - go-cache:/go/pkg/mod
      - oss-data:/data/oss
    ports:
      - "19000:9000"
      - "19001:9001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - 1103-oss-network
    profiles:
      - dev

  # Web 管理界面 (生产模式)
  gooss-web:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.web
    container_name: gooss-web
    ports:
      - "9002:80"
    depends_on:
      - gooss-api
    networks:
      - 1103-oss-network
    restart: unless-stopped
    profiles:
      - prod
      - production

  # Web 管理界面 (开发模式 - 支持热重载)
  gooss-web-dev:
    image: node:20-alpine
    container_name: 1103-oss-web-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ../web:/app
      - node-modules:/app/node_modules
    ports:
      - "3001:3000"
    environment:
      - VITE_API_PROXY_TARGET=http://gooss-api-dev:9000
    networks:
      - 1103-oss-network
    profiles:
      - dev

  # TUI 管理端
  gooss-tui:
    image: golang:1.21-alpine
    container_name: 1103-oss-tui
    working_dir: /app
    command: sh -c "go run ./cmd/tui"
    stdin_open: true
    tty: true
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=oss
      - DB_PASSWORD=${DB_PASSWORD:-oss_password}
      - DB_NAME=oss
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_PATH=/data/oss
      - ROOT_USER=${ROOT_USER:-admin}
      - ROOT_PASSWORD=${ROOT_PASSWORD:-admin123}
      - INIT_ACCESS_KEY=${INIT_ACCESS_KEY:-}
      - INIT_ACCESS_SECRET=${INIT_ACCESS_SECRET:-}
      - LOG_LEVEL=info
      - API_ENDPOINT=${API_ENDPOINT:-}
    volumes:
      - ..:/app
      - go-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - 1103-oss-network
    profiles:
      - tools
      - dev

  # Nginx 网关 (可选)
  nginx:
    image: nginx:alpine
    container_name: 1103-oss-nginx
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - gooss-api
      - gooss-web
    networks:
      - 1103-oss-network
    restart: unless-stopped
    profiles:
      - prod
      - production
      - gateway

volumes:
  postgres-data:
  redis-data:
  oss-data:
  go-cache:
  node-modules:

networks:
  1103-oss-network:
    driver: bridge
